<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我是德区垃圾王</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Trash King DE</p>
        <h1>我是德区垃圾王</h1>
      </div>
      <div class="header-actions">
        <button id="continueButton" class="secondary-button">继续游戏</button>
        <button id="resetButton" class="danger-button">重置游戏</button>
      </div>
    </header>

    <main>
      <section id="startScreen" class="start-screen">
        <div class="start-copy">
          <h2>在规则、邻居和垃圾袋之间活下去</h2>
          <p>每天行动次数有限。处理垃圾、捡瓶子、攒押金，直到你买到真正的垃圾处理自由。</p>
        </div>
        <div class="mode-grid">
          <button class="mode-card" data-new-mode="easy">
            <span class="mode-title">简单模式</span>
            <span>每天 5 次行动，20 欧元开局，垃圾桶更容易找到。</span>
          </button>
          <button class="mode-card hard" data-new-mode="hard">
            <span class="mode-title">困难模式</span>
            <span>每天 3 次行动，8 欧元开局，罚款更痛，空间更紧。</span>
          </button>
        </div>
      </section>

      <section id="gameScreen" class="game-screen hidden">
        <section class="status-grid" aria-label="顶部状态栏">
          <div class="status-item">
            <span>天数</span>
            <strong id="dayValue">1</strong>
          </div>
          <div class="status-item">
            <span>模式</span>
            <strong id="modeValue">简单</strong>
          </div>
          <div class="status-item">
            <span>金钱</span>
            <strong id="moneyValue">20.00 欧元</strong>
          </div>
          <div class="status-item">
            <span>行动</span>
            <strong id="actionsValue">5</strong>
          </div>
          <div class="status-item">
            <span>瓶子</span>
            <strong id="bottlesValue">0 / 36</strong>
          </div>
          <div class="status-item">
            <span>罚款</span>
            <strong id="finesValue">0 / 14</strong>
          </div>
        </section>

        <section id="resultPanel" class="result-panel hidden"></section>

        <section class="daily-panel">
          <div>
            <h2>今日情况</h2>
            <p id="dailySummary">新的一天开始了。</p>
          </div>
          <div class="goal-box">
            <span>通关进度</span>
            <strong id="goalValue">0 / 4 自由</strong>
          </div>
        </section>

        <section id="opportunityPanel" class="opportunity-panel hidden"></section>

        <section>
          <div class="section-heading">
            <h2>家中垃圾状态</h2>
            <span id="limitStreakValue">连续超限 0 天</span>
          </div>
          <div id="garbageCards" class="garbage-grid"></div>
        </section>

        <section class="action-panel">
          <h2>今日行动</h2>
          <div class="action-grid">
            <button data-action="indoor-bin">楼内垃圾桶</button>
            <button data-action="outside-bin">外出找垃圾桶</button>
            <button data-action="walk-bottles">散步捡瓶子</button>
            <button data-action="redeem-bottles">去超市换押金</button>
            <button data-action="compress-trash">在家整理压缩</button>
            <button data-action="unlock-freedom">解锁垃圾自由</button>
            <button data-action="end-day" class="primary-button wide">结束当天</button>
          </div>
        </section>

        <section class="log-panel">
          <div class="section-heading">
            <h2>事件日志</h2>
            <span>最近 80 条</span>
          </div>
          <ol id="logList" class="log-list"></ol>
        </section>
      </section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">操作</h2>
        <button id="modalCloseButton" class="icon-button" aria-label="关闭">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
